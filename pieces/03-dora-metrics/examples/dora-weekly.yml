# Copy to .github/workflows/dora-weekly.yml in the repository you want to measure.
name: dora-weekly

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  issues: read
  pull-requests: read

jobs:
  dora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha> # pin by commit SHA
      - uses: <owner>/ai-devsecops-library/pieces/03-dora-metrics@<sha>
        with:
          compare-at: '2026-03-15' # the date you rolled out AI tools
