# Layer 1. Copy to .pre-commit-config.yaml, then: pre-commit install
# `secrets-guard precommit` runs gitleaks on the staged changes and, when it blocks a commit,
# appends a record (rule ids and file paths, never the secret) to .git/secrets-guard.audit.jsonl.
repos:
  - repo: local
    hooks:
      - id: secrets-guard
        name: secrets-guard (gitleaks)
        # Build the one-file CLI in the library (pnpm --filter @adl/secrets-guard build), copy
        # dist/secrets-guard.mjs to .githooks/, and keep gitleaks installed.
        entry: node .githooks/secrets-guard.mjs precommit --config .gitleaks.toml
        language: system
        pass_filenames: false
