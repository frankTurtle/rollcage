# Agent policy hook configuration. Every key is optional; omitted keys use the defaults in src/config.ts.

# Hosts the agent may contact (WebFetch and shell network tools). "*.example.com" matches subdomains.
allowed_hosts:
  - github.com
  - api.github.com
  - raw.githubusercontent.com
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org
  - code.claude.com
  - platform.claude.com
  - api.anthropic.com
  # - your-internal-docs.example.com

# Directories outside the repository that may be written (scratch space).
allow_write_dirs: ['/tmp', '/private/tmp', '~/.claude']

# Block the call if the audit log cannot be written.
audit_required: true
