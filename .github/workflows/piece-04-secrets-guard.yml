name: piece-04-secrets-guard

on:
  push:
    branches: [main, develop]
    paths:
      ['pieces/04-secrets-guard/**', 'shared/ts/**', '.github/workflows/piece-04-secrets-guard.yml']
  pull_request:
    paths:
      ['pieces/04-secrets-guard/**', 'shared/ts/**', '.github/workflows/piece-04-secrets-guard.yml']

permissions:
  contents: read

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @adl/secrets-guard coverage
      - run: pnpm --filter @adl/secrets-guard build:lambda
      - name: SAM template lints (offline)
        run: |
          if command -v sam >/dev/null; then
            (cd pieces/04-secrets-guard && sam validate --lint --template-file template.yaml)
          else
            echo 'sam not installed on this runner; skipped'
          fi
      - name: Demo runs offline end to end
        run: pnpm demo:04
