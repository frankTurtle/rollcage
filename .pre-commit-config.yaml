# Install: pre-commit install
# gitleaks runs from the locally installed binary (brew install gitleaks).
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --verbose --config .gitleaks.toml
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --check
        language: system
        types_or: [ts, javascript, json, yaml]
      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        types: [ts]
